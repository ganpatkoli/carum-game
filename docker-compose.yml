# Local/production-like stack:  docker compose up --build
# Set real secrets in a .env file next to this one (see .env.example) before exposing it to the internet.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: carrom, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-carrom}", POSTGRES_DB: carrom }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U carrom"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgresql://carrom:${POSTGRES_PASSWORD:-carrom}@postgres:5432/carrom"
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}"
      JWT_ADMIN_SECRET: "${JWT_ADMIN_SECRET:?set JWT_ADMIN_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@carrom.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD (10+ chars)}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3001}"
    ports: ["4000:4000"]
    volumes: [uploads:/app/backend/uploads]
  admin:
    build: { context: ., dockerfile: admin/Dockerfile, args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:4000}" } }
    depends_on: [backend]
    ports: ["3001:3001"]
volumes: { pgdata: {}, uploads: {} }
